[package]
name = "mouser"
description = "One mouse and keyboard across two computers on a LAN."
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iLuzionsX/mouser"

# A root of its own, even when checked out inside another workspace.
[workspace]

[dependencies]
# Only the primitives NNpsk0_25519_ChaChaPoly_SHA256 needs. snow's `std`
# feature is left off on purpose: it would also pull in `ring`.
snow = { version = "0.10", default-features = false, features = [
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
    "use-sha2",
] }
sha2 = { version = "0.10", default-features = false }
tray-icon = "0.24.2"
tao = "0.37.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# `highsierra` gates `CGEvent::new_scroll_event`.
core-graphics = { version = "0.25", features = ["highsierra"] }
# Already pulled in by tray-icon; used for the menu's on/off switch row.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSSwitch",
    "NSText",
    "NSTextField",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
